<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Price</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --ink: #1c1b19;
      --muted: #6f6a60;
      --link: #1c1b19;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151413; --ink: #f2efe8; --muted: #9a958a; --link: #f2efe8; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    main { text-align: center; max-width: 100%; }
    #price {
      font-size: clamp(3.5rem, 18vw, 11rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      margin: 0;
      overflow-wrap: anywhere;
    }
    #price.placeholder { color: var(--muted); font-weight: 300; }
    #link {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: var(--link);
      text-underline-offset: 0.2em;
    }
    #link.placeholder { color: var(--muted); text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <p id="price" class="placeholder" aria-live="polite">—</p>
    <a id="link" class="placeholder">Product link not set yet</a>
  </main>
  <script>
    (async () => {
      const priceEl = document.getElementById('price');
      const linkEl = document.getElementById('link');
      try {
        const res = await fetch('data/price.json', { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();

        if (data.url) {
          linkEl.href = data.url;
          linkEl.textContent = 'View item on the store';
          linkEl.rel = 'noopener';
          linkEl.classList.remove('placeholder');
        }

        if (typeof data.price === 'number') {
          priceEl.textContent = new Intl.NumberFormat('en-CA', {
            style: 'currency',
            currency: data.currency || 'CAD',
          }).format(data.price);
          priceEl.classList.remove('placeholder');
        }
      } catch (e) {
        // No data yet: keep the placeholders.
      }
    })();
  </script>
</body>
</html>
